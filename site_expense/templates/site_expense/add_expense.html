{% extends "index.html" %}
{% load i18n %}

{% block content %}
<div class="oh-container">
    <div class="oh-card">
        <div class="oh-card__body">
            <h1>{% trans "Add Expense" %} — {{ visit.site_name }}</h1>

            <form method="post" enctype="multipart/form-data" style="display:grid;gap:16px;margin-top:20px;">
                {% csrf_token %}
                {% for field in form %}
                    <div>
                        <label class="oh-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <p style="color:red;">{{ field.errors }}</p>
                        {% endif %}
                    </div>
                {% endfor %}
                <div>
                    <button type="submit" class="oh-btn oh-btn--primary">{% trans "Save" %}</button>
                    <a href="{% url 'site_expense:visit-detail' visit.pk %}" class="oh-btn oh-btn--outline">{% trans "Cancel" %}</a>
                </div>
            </form>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    flatpickr(".flat-date", { dateFormat: "Y-m-d" });
</script>
{% endblock content %}
